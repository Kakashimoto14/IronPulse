<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0C0E" />
  <title>IronPulse — Strength Tutor &amp; Tracker</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <canvas id="fx-canvas"></canvas>

  <div id="pr-banner" class="pr-ignition-banner">
    <span>⚡ NEW PR IGNITED</span>
    <span id="pr-banner-detail" class="mono"></span>
  </div>

  <div id="app-shell">
    <header class="top-bar">
      <div class="brand-lockup">
        <div class="brand-mark">IP</div>
        <div>
          <div class="brand-title">IRONPULSE</div>
          <div class="brand-sub" id="top-discipline-label">CALIBRATING...</div>
        </div>
      </div>
      <div class="top-actions">
        <div class="sex-pill" aria-label="Anatomical Model Toggle">
          <button type="button" id="btn-model-male" class="active">MALE</button>
          <button type="button" id="btn-model-female">FEMALE</button>
        </div>
      </div>
    </header>

    <main id="main-view" class="view-enter"></main>

    <nav class="bottom-dock" aria-label="Primary Navigation">
      <button type="button" class="dock-btn btn-tactile active" data-tab="today">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>TODAY</span>
      </button>
      <button type="button" class="dock-btn btn-tactile" data-tab="tutor">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><path d="M6 10l6-1 6 1"/><path d="M12 9v6l-4 6"/><path d="M12 15l4 6"/></svg>
        <span>TUTOR</span>
      </button>
      <button type="button" class="dock-btn btn-tactile" data-tab="progress">
        <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg>
        <span>STATS</span>
      </button>
      <button type="button" class="dock-btn btn-tactile" data-tab="profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg>
        <span>ATHLETE</span>
      </button>
    </nav>
  </div>

  <!-- First-Run 6-Step Athlete Calibration Onboarding -->
  <div id="onboarding-overlay" role="dialog" aria-modal="true">
    <div class="ob-header">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div class="h-kicker" id="ob-step-kicker">STEP 1 OF 6</div>
          <div class="h-display" id="ob-step-title">ANATOMICAL PROFILE</div>
        </div>
        <div class="brand-mark">IP</div>
      </div>
      <div class="ob-step-bar" id="ob-step-bar"></div>
    </div>
    <div class="ob-content" id="ob-content"></div>
    <div class="ob-footer">
      <button type="button" id="ob-back" class="btn btn-secondary btn-tactile" style="flex:0 0 110px;">BACK</button>
      <button type="button" id="ob-next" class="btn btn-primary btn-tactile" style="flex:1;">CONTINUE</button>
    </div>
  </div>

  <!-- Active Workout Focus Mode Overlay -->
  <div id="active-overlay" class="active-overlay" role="dialog" aria-modal="true">
    <div class="active-topbar">
      <div>
        <div class="h-kicker" id="active-session-kicker">ACTIVE SESSION</div>
        <div class="h-section" id="active-session-title">WORKOUT</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span id="active-clock" class="mono" style="font-size:14px;font-weight:800;color:var(--ink-dim);">00:00</span>
        <button type="button" id="btn-finish-workout" class="btn btn-primary btn-sm btn-tactile">FINISH</button>
        <button type="button" id="btn-close-workout" class="btn btn-ghost btn-sm btn-tactile">EXIT</button>
      </div>
    </div>
    <div class="active-body" id="active-body"></div>
    <div class="rest-bar" id="rest-bar" style="display:none;">
      <div class="rest-progress" id="rest-progress" style="width:100%;"></div>
      <div>
        <div class="h-kicker">REST RECOVERY</div>
        <div id="rest-countdown" class="mono" style="font-size:24px;font-weight:900;color:var(--ink-chalk);">02:00</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button type="button" id="btn-rest-minus" class="btn btn-secondary btn-sm btn-tactile">-15S</button>
        <button type="button" id="btn-rest-plus" class="btn btn-secondary btn-sm btn-tactile">+15S</button>
        <button type="button" id="btn-rest-skip" class="btn btn-primary btn-sm btn-tactile">SKIP</button>
      </div>
    </div>
  </div>

  <!-- Exercise Detail / Swap / Backup Bottom Sheet -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="sheet-panel">
      <div class="sheet-head">
        <div>
          <div class="h-kicker" id="modal-kicker">TUTOR</div>
          <div class="h-section" id="modal-title">EXERCISE</div>
        </div>
        <button type="button" id="modal-close" class="btn btn-ghost btn-sm btn-tactile">CLOSE</button>
      </div>
      <div class="sheet-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Session Complete Victory Screen -->
  <div id="victory-overlay" class="victory-overlay" role="dialog" aria-modal="true">
    <div class="victory-card">
      <div class="h-kicker" style="color:var(--signal-crimson);">SESSION LOCKED IN</div>
      <div class="h-display" id="victory-title" style="margin:4px 0 12px;">WORKOUT COMPLETE</div>
      <div class="stat-grid-3" id="victory-stats"></div>
      <div id="victory-prs" style="margin-bottom:14px;"></div>
      <button type="button" id="btn-victory-done" class="btn btn-primary btn-full btn-tactile">RETURN TO DASHBOARD</button>
    </div>
  </div>

  <!-- Modular Offline Engine Scripts (Zero External CDN Calls) -->
  <script src="js/data/exercises.js"></script>
  <script src="js/engine/progression.js"></script>
  <script src="js/engine/program-builder.js"></script>
  <script src="js/engine/kinematics.js"></script>
  <script src="js/engine/rig-renderer.js"></script>
  <script src="js/engine/bodymap.js"></script>
  <script src="js/engine/charts.js"></script>
  <script src="js/engine/fx-engine.js"></script>
  <script src="js/engine/updater.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
